[project]
name = "mini-rag-lab"
version = "0.1.0"
description = "Grounded expense-policy RAG assistant"
readme = "README.md"
authors = [
    { name = "Smit-Coforge", email = "smit.panchal@coforge.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "ollama>=0.5,<1",
    "pgvector>=0.4,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
mini-rag-lab = "mini_rag_lab:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL/pgvector service",
    "live: requires running PostgreSQL/pgvector and Ollama models",
]

[tool.ruff]
line-length = 88
target-version = "py312"
